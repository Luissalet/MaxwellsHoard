[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell-hoard"
version = "0.1.0"
description = "Local physical engineering: steady heat conduction and linear elasticity with verified references"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "fastapi==0.162.0", "uvicorn==0.54.0", "mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["maxwell*"]

[tool.setuptools.package-data]
maxwell = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
